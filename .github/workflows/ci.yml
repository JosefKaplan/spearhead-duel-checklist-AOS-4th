# Runs the same checks as the deploy workflow on pull requests and on pushes to other branches
# (pushes to main are already checked by deploy.yml before they go live).
name: Check

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # app.js must match src/app.jsx exactly, then the smoke test plays 44 games through the UI.
      - run: npm run check
